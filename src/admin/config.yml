# Use DecapBridge classic auth (required)
backend:
    name: git-gateway
    repo: carnagecreations/shiann-field-record
    branch: master
    identity_url: https://auth.decapbridge.com/sites/26a5f4be-33cb-4d80-b8e2-97d323dce8c7
    gateway_url: https://gateway.decapbridge.com

    # See who did what (optional)
    commit_messages:
        create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
        update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
        delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
        uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
        deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
        openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Keep this to allow you to edit the cms locally
local_backend: true

# change url to a link to the image you want to use, no file paths, must be a URL
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://shiann-field-record.pages.dev

# Image folders
media_folder: "src/assets/images/journal"
public_folder: "/assets/images/journal"

# Decap CMS Collections
collections:
    - name: "blog"
      label: "Field Journal"
      folder: "src/content/blog"
      create: true
      slug: "{{slug}}"
      fields:
          - { label: "Title", name: "title", widget: "string" }
          - {
                label: "URL Slug",
                name: "url",
                widget: "string",
                hint: 'Specify where the entry will be written to. If you use "Field Notes", the entry will be accessible from "journal/field-notes"',
            }
          - { label: "Description", name: "description", widget: "string", hint: "Shown in the journal list and social previews." }
          - { label: "Author", name: "author", widget: "string", default: "Shiann Bowman" }
          - { label: "Date", name: "date", widget: "datetime" }
          - {
                label: "Related dig site",
                name: "tags",
                widget: "select",
                multiple: true,
                default: ["post"],
                hint: "Keep 'post' plus optionally tag which dig site(s) this entry relates to.",
                options: ["post", "ops", "care", "train", "build", "mkt", "crisis", "retail", "clean"],
            }
          - { label: "Cover Image", name: "image", widget: "image", required: false }
          - { label: "Image Caption", name: "imageAlt", widget: "string", required: false }
          - { label: "Body", name: "body", widget: "markdown" }
