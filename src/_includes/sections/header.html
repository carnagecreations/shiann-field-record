<!-- ============================================ -->
<!--         Field Record HUD (trail nav)         -->
<!-- ============================================ -->

<div class="fr-hud">
    <div class="fr-topbar">
        <a class="brand-mini" href="/"><b>Shiann Bowman</b> &middot; Field Record</a>
        <a class="back-link" href="/" {% if page.url == "/" %}style="display:none;"{% endif %}>&larr; All paths</a>
    </div>
    <nav class="trail" id="frTrail" aria-label="Path navigator">
        <a class="trail-pip home {% if page.url == "/" %}current{% endif %}" href="/" {% if page.url == "/" %}aria-current="page"{% endif %}>&#9670; Basecamp</a>
        <span class="trail-sep">{% include "components/foot-icon.html" %}</span>
        {% for site in digSites %}
        <a class="trail-pip" data-site-slug="{{ site.slug }}" href="/dig-sites/{{ site.slug }}/" title="{{ site.title }}" {% if page.url == "/dig-sites/" + site.slug + "/" %}aria-current="page"{% endif %}>{{ site.code }}</a>
        {% if not loop.last %}<span class="trail-sep">{% include "components/foot-icon.html" %}</span>{% endif %}
        {% endfor %}
        <span class="trail-progress" id="frTrailProgress"></span>
    </nav>
</div>
