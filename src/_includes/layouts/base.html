<!-- A fully fleshed-out <head>, dynamically changing based on client.json and the page front matter -->

<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Standard meta tags -->
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="{{ description }}">
        <link rel="canonical" href="{{ client.domain }}{{ page.url }}">
        <meta name="generator" content="{{ eleventy.generator }}">

        <!--Social Media Display-->
        <meta property="og:title" content="{{ title }}"/>
        <meta property="og:description" content="{{ description }}"/>
        <meta property="og:type" content="website"/>
        <meta property="og:url" content="{{ client.domain }}{{ page.url }}"/>
        <meta property="og:image" content="{{ image or "/assets/images/logo-small.png" }}"/>
        <meta property="og:image:secure_url" content="{{ image or "/assets/images/logo-small.png" }}"/>

        <!--Favicons-->
        <!-- https://realfavicongenerator.net/ -->
        <link rel="icon" type="image/png" href="/assets/favicons/favicon-96x96.png" sizes="96x96"/>
        <link rel="icon" type="image/svg+xml" href="/assets/favicons/favicon.svg"/>
        <link rel="shortcut icon" href="/assets/favicons/favicon.ico"/>
        <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png"/>
        <meta name="apple-mobile-web-app-title" content="Starter Kit"/>
        <link rel="manifest" href="/assets/favicons/site.webmanifest"/>

        <!-- Preloads -->
        <link rel="preload" as="image" href="/assets/svgs/logo-black.svg">
        <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/roboto-v29-latin-regular.woff2" crossorigin>
        <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/roboto-v29-latin-700.woff2" crossorigin>

        <!-- Sitewide Stylesheets and Scripts -->
        <link rel="stylesheet" href="/assets/css/root.css">
        <script defer src="/assets/js/dark.js"></script>
        <script defer src="/assets/js/nav.js"></script>
        <script defer src="/assets/js/field-record.js"></script>

        {% block head %}{% endblock %}

        <title>{{ title }}</title>
    </head>
    <body class="field-record-page">
        <!--Screen reader skip main nav-->
        <a class="skip" aria-label="skip to main content" href="#main">Click To Skip To Main Content</a>

        {% include "sections/header.html" %}
        <main id="main">
            {% block body %}{% endblock %}
        </main>

        <button class="fr-back-to-top" id="frBackToTop" type="button" aria-label="Back to top">
            <svg class="fr-dino-icon" id="frDinoIcon" viewBox="0 0 48 48" fill="currentColor" aria-hidden="true">
                <path d="M4 34 Q10 23 19 25 L21 31 Q13 31 9 40 Z"/>
                <ellipse cx="25" cy="27" rx="10" ry="8"/>
                <path d="M31 21 Q39 15 41 7 Q43 9 41 13 Q45 13 45 17 Q41 19 37 19 Q35 23 31 25 Z"/>
                <path d="M16 19 L19 12 L22 19 L25 11 L28 19 Z"/>
                <rect x="19" y="33" width="5" height="10" rx="2"/>
                <rect x="28" y="33" width="5" height="10" rx="2"/>
            </svg>
        </button>

        <div class="fr-toast" id="frToast" role="status" aria-live="polite"></div>
        <div class="fr-celebrate-toast" id="frCelebrateToast" role="status" aria-live="polite"></div>
        <div class="fr-intro-overlay" id="frIntroOverlay" aria-hidden="true"></div>
        <div class="fr-lightbox" id="frLightbox" role="dialog" aria-modal="true" aria-label="Enlarged fossil photo" aria-hidden="true">
            <button class="lb-close" id="lbClose" aria-label="Close enlarged photo">&times;</button>
            <img id="lbImg" src="" alt="">
            <div class="lb-caption" id="lbCaption"></div>
            <div class="lb-credit" id="lbCredit"></div>
        </div>
        <script type="application/json" id="frSitesData">{{ digSites | toJson | safe }}</script>
    </body>
</html>
