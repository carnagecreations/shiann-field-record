<!-- ============================================ -->
<!--           More Journal Entries               -->
<!-- ============================================ -->

{% set otherPosts = collections.post | rejectattr("url", "equalto", page.url) | reverse %}
{% if otherPosts.length %}
<section class="reveal">
    <div class="section-head"><span class="tag">More entries</span><h2>Keep reading</h2></div>
    <div class="builds">
        {% for post in otherPosts | limit(4) %}
        <a class="build-card journal-entry-card" href="{{ post.url }}">
            <div class="build-flag">{{ post.data.date | postDate }}</div>
            <div class="build-title">{{ post.data.title }}</div>
            <div class="build-desc">{{ post.data.description }}</div>
        </a>
        {% endfor %}
    </div>
</section>
{% endif %}
