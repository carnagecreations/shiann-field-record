<title>Shiann Bowman — Field Record: A Career Excavation</title>
<style>
  :root{
    --paper:#ece0c4;
    --paper-raised:#f5ecd6;
    --ink:#2c2118;
    --ink-soft:#5c4d3a;
    --rule:#d8c49a;
    --rule-strong:#b99a63;
    --brass:#b5651d;
    --brass-strong:#8f4d14;
    --moss:#3f6a52;
    --moss-soft:#7fa88c15;
    --danger:#8c3d2e;
    --shadow: 2px 2px 0 rgba(44,33,24,0.1);
    --font-display: "Rockwell Nova","Rockwell","Roboto Slab",Georgia,serif;
    --font-body: Seravek,"Gill Sans Nova","Segoe UI",Calibri,sans-serif;
    --font-mono: "Berkeley Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#1c1712; --paper-raised:#26201a; --ink:#ecdfc4; --ink-soft:#b8a37e;
      --rule:#3a2f22; --rule-strong:#4d3f2c; --brass:#d68a3c; --brass-strong:#e8a25a;
      --moss:#7fa88c; --moss-soft:#7fa88c22; --danger:#c07862; --shadow: 2px 2px 0 rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1c1712; --paper-raised:#26201a; --ink:#ecdfc4; --ink-soft:#b8a37e;
    --rule:#3a2f22; --rule-strong:#4d3f2c; --brass:#d68a3c; --brass-strong:#e8a25a;
    --moss:#7fa88c; --moss-soft:#7fa88c22; --danger:#c07862; --shadow: 2px 2px 0 rgba(0,0,0,0.35);
  }
  :root[data-theme="light"]{
    --paper:#ece0c4; --paper-raised:#f5ecd6; --ink:#2c2118; --ink-soft:#5c4d3a;
    --rule:#d8c49a; --rule-strong:#b99a63; --brass:#b5651d; --brass-strong:#8f4d14;
    --moss:#3f6a52; --moss-soft:#7fa88c15; --danger:#8c3d2e; --shadow: 2px 2px 0 rgba(44,33,24,0.1);
  }

  *{box-sizing:border-box;}
  html{background:var(--paper);}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-body); line-height:1.55;
    background-image:
      repeating-linear-gradient(transparent, transparent 27px, var(--rule) 28px),
      repeating-linear-gradient(90deg, transparent, transparent 27px, var(--rule) 28px);
    background-attachment:local;
  }
  .foot-ico{display:inline-flex; align-items:center; justify-content:center; color:var(--rule-strong); flex-shrink:0;}
  .foot-ico svg{display:block; width:1em; height:1em;}

  /* ===== Dino mascot ===== */
  .mascot{display:flex; gap:16px; align-items:center; margin-top:18px; padding:14px 18px; border:1px dashed var(--rule-strong); border-radius:8px; background:var(--paper-raised);}
  .mascot .dino-ico{width:58px; height:36px; color:var(--moss); flex-shrink:0; transition:transform .25s ease;}
  .mascot .dino-ico svg{width:100%; height:100%; display:block;}
  .mascot:hover .dino-ico{transform:scale(1.08) rotate(-3deg);}
  .mascot .m-name{font-family:var(--font-display); font-weight:700; font-size:14.5px; font-style:italic;}
  .mascot .m-name span{font-style:normal; font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--brass); display:block; font-weight:700; margin-bottom:2px;}
  .mascot .m-blurb{font-size:12.5px; color:var(--ink-soft); margin-top:3px; line-height:1.45;}
  @media (prefers-reduced-motion: reduce){ .mascot .dino-ico{transition:none;} }

  /* ===== Circus card (family lore) ===== */
  .circus-card{border:3px double var(--brass); border-radius:8px; padding:28px 30px; background:var(--paper-raised);}
  .circus-card .cc-eyebrow{font-family:var(--font-mono); letter-spacing:.16em; font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; text-align:center;}
  .circus-card .cc-name{font-family:var(--font-display); font-weight:700; font-size:clamp(26px,4.4vw,38px); color:var(--brass-strong); letter-spacing:.02em; margin:8px 0 4px; text-wrap:balance; text-align:center;}
  .circus-card .cc-sub{font-family:var(--font-display); font-style:italic; font-size:14.5px; color:var(--ink-soft); margin-bottom:20px; text-align:center;}
  .circus-card .cc-layout{display:grid; grid-template-columns:200px 1fr; gap:26px; align-items:start;}
  @media (max-width:640px){.circus-card .cc-layout{grid-template-columns:1fr; justify-items:center;}}
  .cc-photo-frame{
    background:#f7f3e8; padding:10px 10px 26px; border-radius:2px; box-shadow:0 4px 14px rgba(0,0,0,.18);
    transform:rotate(-3deg); flex-shrink:0; width:190px;
  }
  .cc-photo-frame img{display:block; width:100%; height:auto; filter:sepia(.35) contrast(1.05);}
  .cc-photo-frame .cc-caption{font-family:var(--font-mono); font-size:9px; text-align:center; color:#6b5d47; margin-top:8px; letter-spacing:.03em;}
  .circus-card .cc-body{font-size:14px; color:var(--ink); text-align:left; line-height:1.65;}
  .circus-card .cc-cite{margin-top:16px; font-family:var(--font-mono); font-size:10.5px; color:var(--ink-soft); text-align:left;}

  /* ===== Words section layout + polaroid ===== */
  .words-layout{display:grid; grid-template-columns:1fr 210px; gap:28px; align-items:start;}
  @media (max-width:640px){.words-layout{grid-template-columns:1fr; justify-items:center;}}
  .polaroid{
    background:#f7f3e8; padding:10px 10px 30px; box-shadow:0 4px 14px rgba(0,0,0,.18);
    transform:rotate(3deg); width:200px; flex-shrink:0;
  }
  .polaroid img{display:block; width:100%; height:auto; filter:saturate(1.03);}
  .polaroid .p-caption{font-family:var(--font-mono); font-size:9px; text-align:center; color:#6b5d47; margin-top:8px; letter-spacing:.03em;}
  .page{max-width:920px;margin:0 auto;padding:0 20px 80px;}
  a{color:inherit;}

  /* ===== Top bar (persistent) ===== */
  .topbar{
    max-width:920px;margin:0 auto;padding:16px 20px 0;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .brand-mini{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-soft); text-decoration:none; display:flex; align-items:center; gap:8px;
  }
  .brand-mini b{color:var(--ink); font-weight:700;}
  .back-link{
    font-family:var(--font-mono); font-size:11.5px; font-weight:600; text-decoration:none;
    color:var(--brass); border:1px solid var(--rule-strong); padding:6px 12px; border-radius:16px;
    display:inline-flex; align-items:center; gap:6px; background:var(--paper-raised);
  }
  .back-link:hover{border-color:var(--brass);}

  /* ===== Masthead (hub) ===== */
  .masthead{padding:36px 0 28px; border-bottom:3px double var(--rule-strong);}
  .kicker{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--brass); margin:0 0 14px; display:flex; align-items:center; gap:7px;
  }
  .name-row{display:flex; flex-wrap:wrap; align-items:baseline; gap:18px; justify-content:space-between;}
  h1{
    font-family:var(--font-display); font-weight:700; font-size:clamp(34px,6vw,54px);
    margin:0; letter-spacing:.01em; text-wrap:balance; color:var(--ink);
  }
  .class-title{font-family:var(--font-display); font-style:italic; font-size:17px; color:var(--ink-soft); margin-top:4px;}
  .field-stamp{
    font-family:var(--font-mono); font-size:11px; text-align:center; color:var(--brass);
    border:1px solid var(--rule-strong); border-radius:50%;
    width:86px; height:86px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    flex-shrink:0; transform:rotate(-6deg); letter-spacing:.04em; align-self:center;
  }
  .field-photo{
    width:92px; height:92px; border-radius:50%; overflow:hidden; border:2.5px solid var(--brass);
    flex-shrink:0; box-shadow:var(--shadow); align-self:center;
  }
  .field-photo img{width:100%; height:100%; object-fit:cover; display:block;}
  .field-stamp b{font-size:20px; font-family:var(--font-display); color:var(--brass); display:block;}
  .bio{max-width:66ch; margin:18px 0 0; font-size:15.5px; color:var(--ink-soft);}
  .contact-line{margin-top:16px; display:flex; flex-wrap:wrap; gap:4px 22px; font-family:var(--font-mono); font-size:12.5px; color:var(--ink-soft);}
  .contact-line a{color:var(--ink); text-decoration:none; border-bottom:1px solid var(--rule-strong);}
  .contact-line a:hover{color:var(--brass); border-color:var(--brass);}

  /* ===== Section scaffolding ===== */
  section{padding:34px 0; border-bottom:1px solid var(--rule);}
  section:last-of-type{border-bottom:none;}
  .section-head{display:flex; align-items:baseline; gap:12px; margin-bottom:20px;}
  .section-head .tag{
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:.12em; color:var(--brass);
    text-transform:uppercase; border:1px solid var(--rule-strong); padding:3px 8px; border-radius:3px;
  }
  h2{font-family:var(--font-display); font-size:23px; margin:0; color:var(--ink); text-wrap:balance;}
  .lede{font-size:13.5px; color:var(--ink-soft); max-width:60ch; margin:6px 0 0;}

  /* ===== Hub tiles (quest-select) ===== */
  .hub-tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px;}
  .hub-tile{
    display:block; text-decoration:none; color:inherit;
    border:1px solid var(--rule-strong); border-radius:8px; padding:20px 20px 18px;
    background:var(--paper-raised); transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    position:relative; overflow:hidden;
  }
  .hub-tile:hover{transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--brass);}
  .hub-tile:focus-visible{outline:2px solid var(--brass); outline-offset:2px;}
  .hub-tile .glyph{
    width:40px; height:40px; border-radius:50%; border:1.5px solid var(--brass);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:16px; color:var(--brass); margin-bottom:12px;
  }
  .hub-tile .t-label{font-family:var(--font-display); font-weight:700; font-size:17px; margin-bottom:4px;}
  .hub-tile .t-sub{font-size:12.5px; color:var(--ink-soft); margin-bottom:10px;}
  .hub-tile .t-go{font-family:var(--font-mono); font-size:11px; color:var(--brass); font-weight:600; display:flex; align-items:center; gap:5px;}
  .hub-tile .t-go .foot-ico{color:var(--brass);}

  /* ===== Lens hero ===== */
  .lens-hero{padding:30px 0 8px;}
  .lens-hero .kicker{margin-bottom:10px;}
  .lens-hero h1{font-size:clamp(28px,5.2vw,42px);}
  .lens-hero .dek{max-width:64ch; font-size:15.5px; color:var(--ink-soft); margin-top:12px;}

  /* ===== Stat block ===== */
  .stats{display:flex; flex-direction:column; gap:14px;}
  .stat-row{display:grid; grid-template-columns:190px 1fr 40px; align-items:center; gap:12px;}
  @media (max-width:560px){.stat-row{grid-template-columns:120px 1fr 34px; gap:8px;}}
  .stat-name{font-size:12.5px; font-weight:600;}
  .stat-track{height:9px; background:var(--paper-raised); border:1px solid var(--rule-strong); border-radius:5px; overflow:hidden;}
  .stat-fill{height:100%; background:linear-gradient(90deg,var(--moss),var(--brass)); width:0; border-radius:5px; animation:fillbar 1s ease-out forwards; animation-delay:.1s;}
  @media (prefers-reduced-motion: reduce){.stat-fill{animation:none; width:var(--pct);}}
  @keyframes fillbar{ to { width:var(--pct); } }
  .stat-num{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft); text-align:right; font-variant-numeric:tabular-nums;}

  /* ===== Ledger / timeline ===== */
  .ledger{border-top:1px solid var(--rule-strong);}
  .entry{display:grid; grid-template-columns:112px 1fr; gap:18px; padding:16px 0; border-bottom:1px solid var(--rule);}
  @media (max-width:560px){.entry{grid-template-columns:1fr;}}
  .entry-dates{font-family:var(--font-mono); font-size:11.5px; color:var(--brass); padding-top:2px;}
  .entry-title{font-weight:700; font-size:15px;}
  .entry-org{font-size:12.5px; color:var(--ink-soft); margin:1px 0 6px;}
  .entry-desc{font-size:13.5px; color:var(--ink-soft); max-width:62ch;}

  /* ===== Build cards ===== */
  .builds{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:640px){.builds{grid-template-columns:1fr;}}
  .build-card{border:1px solid var(--rule-strong); border-radius:8px; padding:18px 20px; background:var(--paper-raised); display:flex; flex-direction:column; gap:8px;}
  .build-flag{font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--brass);}
  .build-title{font-family:var(--font-display); font-weight:700; font-size:16.5px;}
  .build-desc{font-size:13px; color:var(--ink-soft); flex-grow:1;}
  .build-links{display:flex; gap:14px; margin-top:6px; flex-wrap:wrap;}
  .build-links a{font-family:var(--font-mono); font-size:11.5px; font-weight:600; color:var(--ink); text-decoration:none; border-bottom:1px solid var(--brass); padding-bottom:1px;}
  .build-links a:hover{color:var(--brass);}

  /* ===== Badges ===== */
  .badges{display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:16px;}
  .badge{display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px;}
  .badge-seal{
    width:64px; height:64px; border-radius:50%; border:2px solid var(--brass); position:relative;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:18px; color:var(--brass);
    background:radial-gradient(circle at 32% 28%, var(--paper-raised), var(--paper) 70%);
  }
  .badge-seal::before{content:""; position:absolute; inset:5px; border:1px dashed var(--rule-strong); border-radius:50%;}
  .badge-label{font-size:11.5px; font-weight:600; line-height:1.3;}
  .badge-sub{font-family:var(--font-mono); font-size:10px; color:var(--ink-soft);}

  /* ===== Testimonial ===== */
  .testimonial{
    border:1px solid var(--rule-strong); border-radius:8px; padding:22px 24px; background:var(--paper-raised);
    position:relative;
  }
  .testimonial .quote-mark{font-family:var(--font-display); font-size:44px; color:var(--brass); line-height:.4; margin-bottom:6px; display:block;}
  .testimonial .qtext{font-family:var(--font-display); font-style:italic; font-size:17px; color:var(--ink); text-wrap:balance;}
  .testimonial .qwho{margin-top:12px; font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em;}

  /* ===== CTA row ===== */
  .cta-row{display:flex; flex-wrap:wrap; gap:12px; margin-top:6px;}
  .btn{
    font-family:var(--font-mono); font-size:13px; font-weight:600; text-decoration:none;
    padding:11px 22px; border-radius:24px; border:1.5px solid var(--ink);
    color:var(--paper); background:var(--ink); transition:transform .15s ease; display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn.ghost{background:transparent; color:var(--ink); border-color:var(--rule-strong);}
  .btn.brass{background:var(--brass); border-color:var(--brass); color:#fff;}
  .cta-note{font-size:12px; color:var(--ink-soft); margin-top:10px;}

  .close{padding:40px 0 10px; text-align:center;}
  .close h2{font-size:26px;}
  .close p{color:var(--ink-soft); font-size:14px; max-width:46ch; margin:10px auto 22px;}
  .close-actions{display:flex; justify-content:center; gap:14px; flex-wrap:wrap;}

  /* ===== HUD (sticky topbar + trail) ===== */
  .hud{position:sticky; top:0; z-index:30; background:var(--paper); border-bottom:1px solid var(--rule);}
  .trail{
    max-width:920px; margin:0 auto; padding:10px 20px 12px; display:flex; align-items:center; gap:6px;
    overflow-x:auto; scrollbar-width:none;
  }
  .trail::-webkit-scrollbar{display:none;}
  .trail-pip{
    flex-shrink:0; font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:.04em;
    text-decoration:none; color:var(--ink-soft); border:1px solid var(--rule-strong); border-radius:5px;
    padding:5px 9px; background:var(--paper-raised); transition:all .15s ease; position:relative;
  }
  .trail-pip:hover{border-color:var(--brass); color:var(--brass);}
  .trail-pip.visited{border-color:var(--moss); color:var(--moss);}
  .trail-pip.current{background:var(--brass); border-color:var(--brass); color:#fff;}
  .trail-pip.home{color:var(--brass); font-size:13px; padding:5px 10px;}
  .trail-sep{flex-shrink:0; width:13px; height:13px; color:var(--rule-strong); display:inline-flex; opacity:.8;}
  .trail-progress{
    margin-left:auto; flex-shrink:0; font-family:var(--font-mono); font-size:10px; color:var(--ink-soft);
    white-space:nowrap; padding-left:8px;
  }

  /* ===== Scroll reveal ===== */
  .reveal{opacity:0; transform:translateY(16px); transition:opacity .55s ease, transform .55s ease;}
  .reveal.in-view{opacity:1; transform:none;}
  @media (prefers-reduced-motion: reduce){ .reveal{opacity:1; transform:none; transition:none;} }

  /* ===== Route transition ===== */
  #app{transition:opacity .16s ease, transform .16s ease;}
  #app.transit{opacity:0; transform:translateY(6px);}
  @media (prefers-reduced-motion: reduce){ #app{transition:none;} }

  /* ===== Toast (path unlocked) ===== */
  .toast{
    position:fixed; right:18px; bottom:18px; z-index:50; max-width:280px;
    background:var(--ink); color:var(--paper); border-radius:8px; padding:13px 16px;
    font-family:var(--font-mono); font-size:12px; line-height:1.5; box-shadow:0 6px 24px rgba(0,0,0,.25);
    transform:translateY(12px); opacity:0; transition:opacity .3s ease, transform .3s ease;
  }
  .toast.show{opacity:1; transform:translateY(0);}
  .toast b{color:var(--brass-strong); display:block; font-family:var(--font-display); font-size:13.5px; font-style:italic; margin-bottom:2px;}
  @media (prefers-reduced-motion: reduce){ .toast{transition:none;} }

  /* ===== Flagship case study ===== */
  .case-study{border:1.5px solid var(--brass); border-radius:10px; padding:24px 26px; background:var(--paper-raised);}
  .case-study .cs-title{font-family:var(--font-display); font-weight:700; font-size:19px; margin-bottom:14px; display:flex; align-items:center; gap:9px;}
  .case-study .cs-title .foot-ico{color:var(--brass); width:18px; height:18px;}
  .cs-row{display:grid; grid-template-columns:100px 1fr; gap:16px; margin-bottom:12px;}
  @media (max-width:560px){.cs-row{grid-template-columns:1fr; gap:4px;}}
  .cs-row .cs-label{font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--brass); padding-top:2px;}
  .cs-row .cs-text{font-size:13.5px; color:var(--ink-soft); line-height:1.55;}
  .cs-stats{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; padding-top:16px; border-top:1px dashed var(--rule-strong);}
  .cs-stat{text-align:center; min-width:74px;}
  .cs-stat .cs-k{font-family:var(--font-display); font-weight:700; font-size:20px; color:var(--brass);}
  .cs-stat .cs-v{font-family:var(--font-mono); font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}

  .kbd-hint{
    display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:11px; color:var(--ink-soft);
    margin-top:22px;
  }
  .kbd-hint kbd{border:1px solid var(--rule-strong); border-radius:4px; padding:1px 6px; background:var(--paper-raised); font-family:var(--font-mono);}

  ::selection{background:var(--moss-soft); color:var(--ink);}
</style>

<div class="hud">
  <div class="topbar">
    <a class="brand-mini" href="#" onclick="location.hash='';return false;"><b>Shiann Bowman</b> · Field Record</a>
    <a class="back-link" id="backLink" href="#" style="display:none;">← All paths</a>
  </div>
  <nav class="trail" id="trail" aria-label="Path navigator"></nav>
</div>

<div class="page" id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function(){

  var LEDGER_ALL = [
    {dates:'2024 — Present', title:'Founder', org:'Avoria — web design & custom apps (hand-coded, pay after approval)',
     desc:'Independent web design studio — 50+ clients, 5.0 average rating, zero refund requests ever. One flat price per project, $0/month hosting, and no invoice until the client approves a working draft.',

     desc:'Independent care and cleaning practice — no long-term contracts on care, a free-reclean guarantee on cleaning, and the same personal, no-corners-cut standard on both. Handle every client intake, quote, and booking myself — the front-of-house side of the business, not just the labor.',

    {dates:'2021 — Present', title:'Founder & COO', org:'Beauties of the Beasts Animal Rescue, Inc. (501c3)',

              '<div class="cc-caption">PRINCESS NALDU, CIRCA 1920s</div>'+
            '</div>'+
            '<div>'+
              '<div class="cc-body">Long before I ever ran a reptile rescue, my great-aunt Agnes was touring the country with Barnum &amp; Bailey &mdash; billed as Princess Naldu, snake charmer, sharing a sideshow bill with J.G. Tarver (the tallest man) and Princess Wee-Wee (the littlest person). Her husband at the time worked the show as a barker, selling tickets to see them. She crisscrossed nearly the entire United States for it. I didn\'t know any of this when I started rescuing snakes and reptiles of my own &mdash; apparently it skipped a couple generations and came right back.</div>'+
              '<div class="cc-cite">Family history, verified via Find A Grave &middot; memorial #98838984, Saint Gregory Cemetery, Saint Nazianz, WI.</div>'+

      '<section id="words">'+
        '<div class="section-head"><span class="tag">Off the clock</span><h2>In my own words</h2></div>'+
        '<div class="words-layout">'+
          '<p class="lede" style="max-width:66ch;">However you found this page, thank you for actually reading it instead of skimming for keywords. A few things about me that don\'t fit neatly into a stat bar: I will absolutely stop what I\'m doing to help someone catch a loose snake. I keep a rescue running on nights and weekends because the animals don\'t know it\'s a nonprofit and neither do I once I\'m out there. I over-document everything &mdash; ask anyone I\'ve trained. And apparently I come from a long line of people who were never afraid to grab the thing everyone else backs away from, whether that\'s a snake, a hard problem, or a job nobody else wanted to figure out. I like building things people actually use, and I like fixing things people assume are unfixable. If any of that sounds like someone you\'d want on your team, I\'d genuinely love to talk.</p>'+

  function renderLens(id){
    var L = LENSES[id];
    if(!L){ location.hash=''; return; }
    document.getElementById('backLink').style.display = 'inline-flex';

    var entries = pick(LEDGER_ALL, id);
    var builds = pick(BUILDS_ALL, id);
    var badges = pick(BADGES_ALL, id);
    var t = L.testimonial ? TESTIMONIALS[L.testimonial] : null;
    var tHtml = t ? t.map(function(item){
      return '<div class="testimonial"><span class="quote-mark">&ldquo;</span><div class="qtext">'+item.q+'</div><div class="qwho">'+item.who+'</div></div>';
    }).join('') : '';

    var idx = LENS_ORDER.indexOf(id);
    var nextL = LENSES[LENS_ORDER[(idx+1)%LENS_ORDER.length]];
    var prevL = LENSES[LENS_ORDER[(idx-1+LENS_ORDER.length)%LENS_ORDER.length]];
    var mascot = MASCOTS[id];
    var mascotHtml = mascot ? '<div class="mascot">'+dinoIcon()+
      '<div><div class="m-name"><span>Dig-site mascot</span>'+mascot.species+'</div>'+
      '<div class="m-blurb">'+mascot.blurb+'</div></div></div>' : '';

    var app = document.getElementById('app');
    app.innerHTML =
      '<div class="lens-hero">'+
        '<p class="kicker">'+L.kicker+'</p>'+
        '<h1>'+L.headline+'</h1>'+
        '<p class="dek">'+L.dek+'</p>'+
        '<div class="kbd-hint"><kbd>&larr;</kbd> '+prevL.label+' &nbsp;·&nbsp; '+nextL.label+' <kbd>&rarr;</kbd></div>'+
        mascotHtml+
      '</div>'+
      (L.flagship ? '<section>'+caseStudyHtml(L.flagship)+'</section>' : '')+
      '<section><div class="section-head"><span class="tag">Vitals</span><h2>Working stats</h2></div>'+
        statBlockHtml(L.stats) + '</section>'+
      '<section><div class="section-head"><span class="tag">Dig log</span><h2>Relevant service record</h2></div>'+
        ledgerHtml(entries) + '</section>'+
      (builds.length ? '<section><div class="section-head"><span class="tag">Recovered artifacts</span><h2>Shipped, not just proposed</h2></div>' + buildsHtml(builds) + '</section>' : '')+
      (t ? '<section><div class="section-head"><span class="tag">Field notes</span><h2>What clients say</h2></div>'+
        '<div style="display:flex;flex-direction:column;gap:14px;">'+tHtml+'</div></section>' : '')+
      (badges.length ? '<section><div class="section-head"><span class="tag">Fossil record</span><h2>Credentials &amp; milestones</h2></div>' + badgesHtml(badges) + '</section>' : '')+
      '<section class="close" style="text-align:left;">'+
        '<div class="section-head"><span class="tag">Next expedition</span><h2>Take this further</h2></div>'+
        '<div class="cta-row">'+
          '<a class="btn brass" '+(L.ctaPrimary.href.indexOf("http")===0 ? 'target="_blank" rel="noopener"' : '')+' href="'+L.ctaPrimary.href+'">'+L.ctaPrimary.label+'</a>'+
          '<a class="btn ghost" href="'+L.ctaSecondary.href+'">'+L.ctaSecondary.label+'</a>'+
        '</div>'+
        '<p class="cta-note">'+L.ctaNote+'</p>'+
      '</section>';
  }

  function renderTrail(currentId){
    var trail = document.getElementById('trail');
    var visited = getVisited();
    var sep = '<span class="trail-sep">'+footIcon()+'</span>';
    var html = '<a class="trail-pip home'+(!currentId ? ' current' : '')+'" href="#">&#9670; Basecamp</a>'+sep;
    html += LENS_ORDER.map(function(id){
      var cls = 'trail-pip';
      if(id === currentId) cls += ' current';
      else if(visited.indexOf(id) !== -1) cls += ' visited';
      return '<a class="'+cls+'" href="#'+id+'" title="'+LENSES[id].label+'">'+CODES[id]+'</a>';
    }).join(sep);
    html += '<span class="trail-progress">'+visited.length+' / '+LENS_ORDER.length+' sites excavated</span>';
    trail.innerHTML = html;
  }

  function showToast(id){
    var L = LENSES[id];
    var t = document.getElementById('toast');
    t.innerHTML = '<b>Dig site uncovered</b>'+L.label;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 3200);
  }

  function attachReveal(){
    var app = document.getElementById('app');
    var els = app.querySelectorAll('section, .lens-hero, header.masthead');
    if(REDUCE || !('IntersectionObserver' in window)){ return; }
    var obs = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){ en.target.classList.add('in-view'); obs.unobserve(en.target); }
      });
    }, {threshold:0.1});
    els.forEach(function(el){ el.classList.add('reveal'); obs.observe(el); });
  }

  function attachTilt(){
    if(REDUCE) return;
    document.querySelectorAll('.hub-tile').forEach(function(tile){
      tile.addEventListener('mousemove', function(e){
        var r = tile.getBoundingClientRect();
        var x = (e.clientX - r.left) / r.width - 0.5;
        var y = (e.clientY - r.top) / r.height - 0.5;
        tile.style.transform = 'perspective(500px) rotateX('+(-y*6)+'deg) rotateY('+(x*6)+'deg) translateY(-3px)';
      });
      tile.addEventListener('mouseleave', function(){ tile.style.transform = ''; });
    });
  }

  function paint(){
    var hash = location.hash.replace('#','');
    var wasVisited = hash ? getVisited().indexOf(hash) !== -1 : true;
    if(!hash){ renderHub(); attachTilt(); }
    else { renderLens(hash); if(!wasVisited){ addVisited(hash); } }
    renderTrail(hash);
    attachReveal();
    window.scrollTo(0,0);
    if(hash && !wasVisited){ showToast(hash); }
    var app = document.getElementById('app');
    if(!REDUCE){ requestAnimationFrame(function(){ app.classList.remove('transit'); }); }
  }

  function render(){
    var app = document.getElementById('app');
    if(REDUCE || !app.innerHTML.trim()){ paint(); return; }
    app.classList.add('transit');
    setTimeout(paint, 140);
  }

  document.getElementById('backLink').addEventListener('click', function(e){
    e.preventDefault(); location.hash='';
  });
  document.addEventListener('keydown', function(e){
    if(e.target && /input|textarea/i.test(e.target.tagName)) return;
    var hash = location.hash.replace('#','');
    var idx = LENS_ORDER.indexOf(hash);
    if(idx === -1) return;
    if(e.key === 'ArrowRight'){ location.hash = LENS_ORDER[(idx+1) % LENS_ORDER.length]; }
    else if(e.key === 'ArrowLeft'){ location.hash = LENS_ORDER[(idx-1+LENS_ORDER.length) % LENS_ORDER.length]; }
  });
  window.addEventListener('hashchange', render);
  render();
})();
</script>
